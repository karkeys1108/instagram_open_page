<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open Picloopz Securely</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --blue: #4f8cff;
      --pink: #ff5fa2;
      --text: #111827;
      --muted: #6b7280;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', system-ui, sans-serif;
      background: linear-gradient(135deg, #f5f9ff, #fff5fa);
      padding: 20px;
    }

    .container {
      max-width: 380px;
      width: 100%;
      background: linear-gradient(180deg, #ffffff, #f9fafb);
      border-radius: 22px;
      padding: 38px 28px;
      text-align: center;
      box-shadow:
        0 30px 60px rgba(0, 0, 0, 0.10),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
      animation: fadeUp 0.6s ease-out;
      backdrop-filter: blur(12px);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    img {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 24px;
      padding: 4px;
      background: linear-gradient(135deg, var(--blue), var(--pink));
      box-shadow: 0 12px 28px rgba(79, 140, 255, 0.35);
    }

    h1 {
      font-size: 23px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, var(--blue), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 14.5px;
      font-weight: 400;
      color: #4b5563;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--blue), var(--pink));
      color: #ffffff;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 32px rgba(79, 140, 255, 0.4);
    }

    .note {
      margin-top: 20px;
      font-size: 12.5px;
      font-weight: 500;
      color: #9ca3af;
    }

    .ios-hint {
      display: none;
      margin-top: 14px;
      font-size: 13px;
      color: #374151;
    }

    .ios-hint span {
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="pic.jpg" alt="Picloopz Logo" />

    <h1>Open Picloopz</h1>

    <p>
      For a smooth and secure experience, please continue in your browser.
    </p>

    <button onclick="openInBrowser()">Continue in Browser</button>

    <div class="note">
      Best experience on Chrome or Safari
    </div>

    <!-- iOS instruction -->
    <div class="ios-hint" id="iosHint">
      On iPhone: tap <span>⋮</span> → <span>Open in Safari</span>
    </div>
  </div>

  <script>
    function openInBrowser() {
      const url = "https://picloopz.com";
      const ua = navigator.userAgent || navigator.vendor;

      const isInstagram = ua.includes("Instagram");
      const isAndroid = ua.includes("Android");
      const isIOS = /iPhone|iPad|iPod/i.test(ua);

      if (isInstagram && isAndroid) {
        // Force Chrome on Android
        window.location.href =
          "intent://picloopz.com#Intent;" +
          "scheme=https;" +
          "package=com.android.chrome;" +
          "end";
      } else {
        window.open(url, "_blank");
      }

      if (isInstagram && isIOS) {
        document.getElementById("iosHint").style.display = "block";
      }
    }
  </script>

</body>
</html>
