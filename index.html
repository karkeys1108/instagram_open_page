<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open Picloopz Securely</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --blue: #4f8cff;
      --pink: #ff5fa2;
      --text: #1a1a1a;
      --muted: #6b7280;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', system-ui, sans-serif;
      background: linear-gradient(135deg, #f5f9ff, #fff5fa);
      padding: 20px;
    }

    .container {
      max-width: 360px;
      width: 100%;
      background: #ffffff;
      border-radius: 18px;
      padding: 34px 26px;
      text-align: center;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.08);
      animation: fadeUp 0.6s ease-out;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    img {
      width: 96px;
      margin-bottom: 22px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.4px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--blue), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 14px;
      font-weight: 400;
      color: var(--muted);
      line-height: 1.7;
      letter-spacing: 0.2px;
      margin-bottom: 28px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.3px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--blue), var(--pink));
      color: #ffffff;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      animation: pulse 2.2s ease-in-out infinite;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(79, 140, 255, 0.35);
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(255, 95, 162, 0.35);
      }
      50% {
        box-shadow: 0 0 0 10px rgba(255, 95, 162, 0);
      }
    }

    .note {
      margin-top: 18px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.3px;
      color: #9ca3af;
    }

    .ios-hint {
      display: none;
      margin-top: 14px;
      font-size: 13px;
      color: #374151;
    }

    .ios-hint span {
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="pic.jpg" alt="Picloopz" />

    <h1>Open Picloopz </h1>

    <p>
      For a smooth and secure experience, open Picloopz in your browser.
    </p>

    <button onclick="openInBrowser()">Continue in Browser</button>

    <div class="note">
      Best experience in Chrome or Safari
    </div>

    <!-- iOS instruction -->
    <div class="ios-hint" id="iosHint">
      On iPhone: tap <span>⋮</span> in the top right → <span>Open in Safari</span>
    </div>
  </div>

  <script>
    function openInBrowser() {
      const url = "https://picloopz.com";
      const ua = navigator.userAgent || navigator.vendor;

      const isInstagram = ua.includes("Instagram");
      const isAndroid = ua.includes("Android");
      const isIOS = /iPhone|iPad|iPod/i.test(ua);

      if (isInstagram && isAndroid) {
        // Force Chrome on Android
        window.location.href =
          "intent://picloopz.com#Intent;" +
          "scheme=https;" +
          "package=com.android.chrome;" +
          "end";
      } else {
        window.open(url, "_blank");
      }

      // Show iOS instruction
      if (isInstagram && isIOS) {
        document.getElementById("iosHint").style.display = "block";
      }
    }
  </script>

</body>
</html>
