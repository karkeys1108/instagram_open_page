<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open Picloopz</title>

  <style>
    :root {
      --blue: #4f8cff;
      --pink: #ff5fa2;
      --text: #1a1a1a;
      --muted: #6b7280;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #f5f9ff, #fff5fa);
      padding: 20px;
    }

    .container {
      max-width: 360px;
      width: 100%;
      background: #ffffff;
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
      animation: fadeUp 0.6s ease-out;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    img {
      width: 100px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 22px;
      color: var(--text);
      margin-bottom: 10px;
    }

    p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 26px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--blue), var(--pink));
      color: #ffffff;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      animation: pulse 2s ease-in-out infinite;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(79, 140, 255, 0.3);
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(255, 95, 162, 0.4);
      }
      50% {
        box-shadow: 0 0 0 8px rgba(255, 95, 162, 0);
      }
    }

    .note {
      margin-top: 16px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="logo.png" alt="Picloopz" />

    <h1>Open in Browser</h1>

    <p>
      Instagram’s in-app browser may block login or payments.<br>
      Open Picloopz in your browser for the best experience.
    </p>

    <button onclick="openInBrowser()">Open Picloopz</button>

    <div class="note">
      Works best in Chrome or Safari
    </div>
  </div>

  <script>
    function openInBrowser() {
      const url = "https://picloopz.com";
      const ua = navigator.userAgent || navigator.vendor;

      const isInstagram = ua.includes("Instagram");
      const isAndroid = ua.includes("Android");

      if (isInstagram && isAndroid) {
        window.location.href =
          "intent://picloopz.com#Intent;" +
          "scheme=https;" +
          "package=com.android.chrome;" +
          "end";
      } else {
        window.open(url, "_blank");
      }
    }
  </script>

</body>
</html>
