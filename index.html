<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open Picloopz</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #ffffff;
      color: #111;
      padding: 20px;
    }

    .container {
      max-width: 360px;
      width: 100%;
      text-align: center;
    }

    img {
      width: 110px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 12px;
    }

    p {
      font-size: 14px;
      color: #555;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: #111;
      color: #fff;
      cursor: pointer;
    }

    .note {
      margin-top: 14px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="logo.png" alt="Picloopz" />

    <h1>Open in Browser</h1>

    <p>
      Instagram’s in-app browser may block login or payments.<br>
      Please open Picloopz in your browser.
    </p>

    <button onclick="openInBrowser()">Open Picloopz</button>

    <div class="note">
      Best experience in Chrome or Safari
    </div>
  </div>

  <script>
    function openInBrowser() {
      const url = "https://picloopz.com";
      const ua = navigator.userAgent || navigator.vendor;

      const isInstagram = ua.includes("Instagram");
      const isAndroid = ua.includes("Android");

      if (isInstagram && isAndroid) {
        // ✅ Forces Chrome on Android
        window.location.href =
          "intent://picloopz.com#Intent;" +
          "scheme=https;" +
          "package=com.android.chrome;" +
          "end";
      } else {
        // Normal open
        window.open(url, "_blank");
      }
    }
  </script>

</body>
</html>
